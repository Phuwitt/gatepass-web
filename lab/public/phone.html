<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>GATEPASS — ทดสอบ QR บนมือถือ</title><link rel="stylesheet" href="/style.css"></head><body class="phone-body"><main class="phone-wrap"><a class="brand" href="/"><svg viewBox="0 0 30 36" aria-hidden="true"><path d="M3 32h24M7 31V5l15-2v29M17 18h2"/></svg>GATEPASS LAB</a><section class="phone-card"><h1>เข้าอาคารด้วย QR</h1><p>พอร์ทัลสำหรับชุดทดสอบเครื่อง R1<br>เลือกพนักงานเพื่อส่งตรวจสิทธิ์ในฐานข้อมูลทดสอบ ไม่มีการยืนยันตัวตนด้วยบัญชีแอปจริง</p><form id="phone-form"><label>พนักงานทดสอบ<select id="phone-employee" required><option value="">กำลังอ่าน QR…</option></select></label><button class="primary" id="phone-submit" disabled>ยืนยันเข้าอาคาร</button></form><div id="phone-result" class="phone-result" hidden role="status"></div><small id="phone-expiry" style="display:block;margin-top:20px">QR ใช้ได้ครั้งเดียว ภายใน 60 วินาที</small></section></main><div id="toast" role="status" hidden></div><script type="module" src="/phone.js"></script></body></html>
